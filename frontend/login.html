
<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login | Roundhouse Volunteer Hub</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">

</head>

<body class="d-flex flex-column">

    <div class="page page-center">

        <div class="container container-tight py-4">

            <div class="text-center mb-4">

                <h1>Roundhouse Volunteer Hub</h1>

            </div>

            <form class="card card-md"
                  action="/auth/login"
                  method="POST">

                <input type="hidden"
                       name="_csrf"
                       value="__CSRF_TOKEN__">

                <div class="card-body">

                    <h2 class="h2 text-center mb-4">
                        Login to your account
                    </h2>

                    <div id="login-error"
                         class="alert alert-danger"
                         role="alert"
                         hidden>
                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="email">
                            Email address
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your email"
                               autocomplete="username"
                               maxlength="150"
                               required>

                    </div>

                    <div class="mb-2">

                        <label class="form-label" for="password">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>

                    </div>

                    <div class="form-footer">

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Sign in
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>

    <script>

                const params = new URLSearchParams(window.location.search);
                const error = params.get("error");

                const errorBox = document.getElementById("login-error");
                const emailInput = document.getElementById("email");
                const passwordInput = document.getElementById("password");

                if (errorBox) {

                    if (error === "invalid") {

                        errorBox.textContent =
                            "Invalid email or password.";

                        errorBox.hidden = false;

                    } else if (error === "missing") {

                        errorBox.textContent =
                            "Please enter your email and password.";

                        errorBox.hidden = false;

                    } else if (error === "limited") {

                        errorBox.textContent =
                            "Too many login attempts. Please try again later.";

                        errorBox.hidden = false;

                    }

                    function clearError() {

                        if (errorBox && error !== "limited") {

                            errorBox.hidden = true;

                            window.history.replaceState(
                                null, "", "/login"
                            );

                        }

                    }

                    if (emailInput) {

                        emailInput.addEventListener("focus", clearError);
                        emailInput.addEventListener("input", clearError);

                    }

                    if (passwordInput) {

                        passwordInput.addEventListener("focus", clearError);
                        passwordInput.addEventListener("input", clearError);

                    }

                }

    </script>

</body>

</html>
